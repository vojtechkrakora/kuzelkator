services:
  web:
    build: .
    ports:
      - "127.0.0.1:${KUZELKATOR_PORT:-43127}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache/images:uid=1001,gid=1001,mode=0700,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
