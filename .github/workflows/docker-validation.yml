name: Linux Docker validation
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build production image (includes unit tests and TypeScript build)
        run: |
          test "$(uname -m)" = x86_64
          git rev-parse HEAD
          docker build --platform linux/amd64 --build-arg RENDER_GIT_COMMIT="$(git rev-parse HEAD)" -t kuzelkator:candidate .
      - name: Run production container
        run: |
          docker run -d --name release-check --read-only --init --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp --tmpfs /app/.next/cache/images:uid=1001,gid=1001,mode=0700,size=64m -p 127.0.0.1:43128:3000 kuzelkator:candidate
          curl --fail --retry 12 --retry-all-errors --retry-connrefused --retry-delay 2 --max-time 10 http://localhost:43128/api/health
      - name: Check native image processing
        run: |
          docker exec release-check node -e 'const sharp = require("sharp"); (async () => { for (let i = 0; i < 10; i++) { const png = await sharp({create:{width:128,height:128,channels:3,background:"red"}}).png().toBuffer(); await sharp(png).resize(32).webp().toBuffer(); } console.log("PNG decode, resize and WebP encode passed"); })().catch(e => { console.error(e); process.exit(1); });'
      - name: Browser tests against Docker
        env:
          TEST_BASE_URL: http://localhost:43128
        run: npm run test:e2e
      - name: Verify container stayed running
        run: |
          test "$(docker inspect --format '{{.State.Running}}' release-check)" = true
          test "$(docker inspect --format '{{.RestartCount}}' release-check)" = 0
          curl --fail --max-time 10 http://localhost:43128/api/health
      - name: Container logs
        if: always()
        run: docker logs release-check || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
      - name: Stop candidate
        if: always()
        run: docker rm -f release-check || true
